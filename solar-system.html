<style>

{n:"Mercury",au:.387,d:88,r:3,c:"#b5aea6",t:"Rocky",dia:"4,879 km",day:"59 Earth days",m:0,txt:"The smallest planet and the closest to the Sun. Almost no atmosphere, so days are scorching and nights freezing."},

];

const RK={Mercury:2440,Venus:6052,Earth:6371,Mars:3390,Ceres:473,Jupiter:69911,Saturn:58232,Uranus:25362,Neptune:24622,Pluto:1188,Haumea:800,Makemake:715,Eris:1163};
const speedDays=()=>{const v=+speed.value;return v===0?0:Math.pow(10,v/25-1)};
function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;fit()}
function fit(){cam.s=Math.min(W,H)/2/(TRUE?dist(50)+5:dist(42)+30);cam.x=0;cam.y=0}
addEventListener("resize",resize);
function pos(p){if(p.par){const pp=pos(p.par),rad=TRUE?p.km/KM*U:orbR(p)/cam.s,a=p.l2?Math.atan2(pp.y,pp.x):p.a0+6.283*t/p.d;return{x:pp.x+Math.cos(a)*rad,y:pp.y+Math.sin(a)*rad}}if(!p.au)return{x:0,y:0};const a=p.a0+2*Math.PI*t/p.d,r=dist(p.au);return{x:Math.cos(a)*r,y:Math.sin(a)*r}}
P.forEach((p,i)=>p.a0=i*1.7+.4);P.forEach(p=>p.rk=RK[p.n]);SUN.rk=696000;
const MS={
Earth:"Moon,384400,27.32,1737",
Mars:"Phobos,9376,.319,11;Deimos,23463,1.263,6",
Jupiter:"Metis,128000,.295,22;Adrastea,129000,.298,8;Amalthea,181400,.498,84;Thebe,221900,.675,49;Io,421700,1.769,1822;Europa,671100,3.551,1561;Ganymede,1070400,7.155,2634;Callisto,1882700,16.689,2410;Leda,11165000,240.9,10;Himalia,11461000,250.6,70;Lysithea,11717000,259.2,18;Elara,11741000,259.6,43;Ananke,21276000,-610,14;Carme,23404000,-702,23;Pasiphae,23624000,-743.6,30;Sinope,23939000,-758.9,19",
Saturn:"Pan,133584,.575,14;Atlas,137670,.602,15;Daphnis,136505,.594,4;Prometheus,139380,.613,43;Pandora,141720,.629,40;Epimetheus,151410,.694,58;Janus,151470,.695,89;Mimas,185540,.942,198;Enceladus,238040,1.37,252;Tethys,294670,1.888,531;Dione,377420,2.737,561;Rhea,527070,4.518,764;Titan,1221870,15.945,2575;Hyperion,1500880,21.28,135;Iapetus,3560840,79.32,735;Phoebe,12947780,-550.5,107",

Pluto:"Charon,19591,6.387,606;Styx,42656,20.16,5;Nix,48694,24.85,20;Kerberos,57783,32.17,6;Hydra,64738,38.2,25",
Haumea:"Namaka,25657,18.3,85;Hi'iaka,49880,49.5,160",
Makemake:"MK 2,21000,12.4,88",
Eris:"Dysnomia,37273,15.79,350"};
const TX={Moon:"Earth's only natural satellite. Always shows the same face to us.",Phobos:"Orbits so close to Mars that it circles the planet three times a day.",Io:"The most volcanically active world in the solar system.",Europa:"An ice shell hides a global ocean, a top target in the search for life.",Ganymede:"The largest moon in the solar system, bigger than Mercury.",Callisto:"One of the most heavily cratered surfaces known.",Titan:"Has a thick atmosphere and lakes of liquid methane.",Enceladus:"Geysers of water ice spray from its south pole and feed Saturn's E ring.",Iapetus:"Two-toned: one hemisphere is dark, the other bright.",Triton:"Orbits backwards, so it was probably captured from the Kuiper belt.",Miranda:"Its surface is a patchwork of huge cliffs and canyons.",Charon:"Half the size of Pluto. The two orbit a point between them.",Pan:"Sweeps the Encke Gap clear inside Saturn's A ring.",Atlas:"Sculpts the sharp outer edge of the A ring.",Daphnis:"Carves a narrow gap into the edge of the A ring.",Prometheus:"Shepherds the thin F ring from the inside.",Pandora:"Shepherds the thin F ring from the outside.",Mimas:"Its gravity helps keep the Cassini Division empty.",Phoebe:"A captured, retrograde moon that orbits far outside Saturn's main system."};
const MO=[];for(const [pn,str] of Object.entries(MS))str.split(";").forEach(z=>{const [n,km,d,rk]=z.split(",");MO.push({n,par:pn,moon:1,km:+km,d:+d,rk:+rk,c:"#cfd6e6",txt:TX[n]})});
const T=[
{n:"Hubble",par:"Earth",km:6918,d:.0663,off:4,c:"#7fd4c8",orb:"Low Earth orbit, about 540 km up, one lap every 95 min",launched:"1990",mirror:"2.4 m, visible, UV and near-infrared",txt:"Orbits above the atmosphere, so its images stay sharp. Astronauts serviced it five times."},
{n:"Chandra",par:"Earth",km:80000,d:2.67,off:9,c:"#7fd4c8",orb:"Elongated Earth orbit, 16,000 to 133,000 km, about 64 hours",launched:"1999",mirror:"1.2 m nested X-ray mirrors",txt:"Studies X-rays from black holes, exploded stars and galaxy clusters. Earth's atmosphere blocks these from the ground."},
{n:"TESS",par:"Earth",km:242000,d:13.7,off:14,c:"#7fd4c8",orb:"Earth orbit in a 2:1 resonance with the Moon, 13.7 days",launched:"2018",mirror:"Four 10.5 cm wide-field cameras",txt:"Scans nearly the whole sky for planets passing in front of nearby stars."},
{n:"James Webb",par:"Earth",l2:1,km:1.5e6,d:365.25,off:19,c:"#7fd4c8",orb:"Halo orbit around the Sun-Earth L2 point, 1.5 million km from Earth",launched:"2021",mirror:"6.5 m gold-coated, infrared",txt:"Sits on the night side of Earth behind a tennis-court-sized sunshield to stay extremely cold."}
];
const OBJ=[...T,...MO],G={};OBJ.forEach((k,i)=>{k.par=P.find(p=>p.n===k.par);k.a0=i*2.3;k.off=4+(G[k.par.n]=(G[k.par.n]+1)||0)*5.5});
const belt=(n,a,b,c)=>Array.from({length:n},()=>({au:a+Math.random()*(b-a),a:Math.random()*6.283,c}));
const AB=belt(450,2.2,3.2,"#a69a8a"),KB=belt(800,30,50,"#7d8fb5");
function w2s(px,py){return{x:W/2+(px-cam.x)*cam.s,y:H/2+(py-cam.y)*cam.s}}
function s2w(sx,sy){return{x:(sx-W/2)/cam.s+cam.x,y:(sy-H/2)/cam.s+cam.y}}
const RB=[[66900,74500,.12],[74500,92000,.3],[92000,117500,.8],[122200,133400,.6],[133800,136800,.6],[139900,140500,.7],[166000,175000,.12],[180000,480000,.06]];
function kmPx(km,r){return km<=250000?r*km/58232:r*4.3+Math.log10(km/250000)*60}
function orbR(k){const par=k.par;if(TRUE)return k.km/KM*U*cam.s;const r=pr(par);return par.ring?kmPx(k.km,r):r+k.off}
function drawRings(s,r){for(const [a,b,al] of RB){const ra=TRUE?a/KM*U*cam.s:kmPx(a,r),rb=TRUE?b/KM*U*cam.s:kmPx(b,r);if(rb>1e5)continue;x.strokeStyle="rgba(227,207,154,"+al+")";x.lineWidth=Math.max(rb-ra,.8);x.beginPath();x.arc(s.x,s.y,(ra+rb)/2,0,7);x.stroke()}}

function draw(now){
  const dt=(now-last)/1000;last=now;t+=dt*speedDays();
  if(follow){const fb=follow.par||follow,q=pos(fb);const dx=q.x-cam.x,dy=q.y-cam.y,k=Math.hypot(dx,dy)*cam.s<4?1:.2;cam.x+=dx*k;cam.y+=dy*k;if(TRUE){if(!zlock){const ml=OBJ.filter(k=>k.par===follow&&k.moon).sort((a,b)=>b.rk-a.rk)[0],ext=follow.par?follow.km*(follow.l2?1.3:1.6):ml?ml.km*1.4:follow.rk*3;const tg=Math.min(Math.max(Math.min(W,H)*.32/(ext/KM*U),.05),3e4);cam.s*=Math.pow(tg/cam.s,.08)}}
  else{const target=fb.au?Math.max(cam.s,(follow.par?2:1)*Math.min(W,H)/2/(dist(fb.au)*.6+30)):cam.s;if(cam.s<target)cam.s*=1.03}}

  x.font="11px system-ui";x.fillStyle="#6c7896";x.textAlign="center";
  for(const [l,au] of [["Asteroid belt",2.7],["Kuiper belt",40]]){const r=dist(au)*cam.s;if(r>40&&r<W*2)x.fillText(l,c.x,c.y-r-6)}
  const g=x.createRadialGradient(c.x,c.y,0,c.x,c.y,pr(SUN)*3);g.addColorStop(0,"rgba(255,207,92,.55)");g.addColorStop(1,"rgba(255,207,92,0)");
  x.fillStyle=g;x.beginPath();x.arc(c.x,c.y,pr(SUN)*3,0,7);x.fill();
  x.fillStyle=SUN.c;x.beginPath();x.arc(c.x,c.y,pr(SUN),0,7);x.fill();
  x.font="12px 'Trebuchet MS',system-ui,sans-serif";x.textAlign="center";
  for(const p of P){const q=pos(p),s=w2s(q.x,q.y),r=pr(p);p.sx=s.x;p.sy=s.y;p.sr=r;

function gTex(n,cb){if(TXC[n])return cb();const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const q=c.getContext("2d");q.drawImage(im,0,0);TXC[n]=q.getImageData(0,0,im.width,im.height);cb()};im.src=GI[n]}
function gDraw(){const t=TXC[gN];if(!t)return;const d=gim.data,tw=t.width,th=t.height,td=t.data,cl=Math.cos(gLat),sl=Math.sin(gLat);
  for(let j=0;j<GS;j++){const Y=1-(j+.5)/GS*2;for(let i=0;i<GS;i++){const X=(i+.5)/GS*2-1,r2=X*X+Y*Y,o=(j*GS+i)*4;
    if(r2>=1){d[o+3]=0;continue}
    const Z=Math.sqrt(1-r2),Yw=Y*cl+Z*sl,Zw=-Y*sl+Z*cl;
    let u=((gLon+Math.atan2(X,Zw))/6.28319+.5)%1;if(u<0)u+=1;u*=tw;
    const v=(.5-Math.asin(Yw)/Math.PI)*(th-1),xf=Math.floor(u),x0=xf%tw,x1=(x0+1)%tw,fx=u-xf,y0=Math.min(Math.floor(v),th-2),fy=v-y0,
      a=(y0*tw+x0)*4,b=(y0*tw+x1)*4,c=((y0+1)*tw+x0)*4,e=((y0+1)*tw+x1)*4,sh=.4+.6*Math.pow(Z,.6);
    for(let k=0;k<3;k++)d[o+k]=((td[a+k]*(1-fx)+td[b+k]*fx)*(1-fy)+(td[c+k]*(1-fx)+td[e+k]*fx)*fy)*sh;
    d[o+3]=255}}
  gx.putImageData(gim,0,0);gx.strokeStyle="rgba(127,212,200,.35)";gx.lineWidth=1.5;gx.beginPath();gx.arc(GS/2,GS/2,GS/2-1,0,7);gx.stroke();
  gx.font="10px system-ui";gx.lineJoin="round";
  for(const [nm,la,lo] of FT[gN]){const p=la*Math.PI/180,l=lo*Math.PI/180-gLon,Xw=Math.cos(p)*Math.sin(l),Yw=Math.sin(p),Zw=Math.cos(p)*Math.cos(l),Y=Yw*cl-Zw*sl,Z=Yw*sl+Zw*cl;
    if(Z<.2)continue;const px=GS/2+Xw*GS/2,py=GS/2-Y*GS/2,tw2=gx.measureText(nm).width,tx=Math.max(2,Math.min(px+5,GS-tw2-2));
    gx.fillStyle="#7fd4c8";gx.beginPath();gx.arc(px,py,2.5,0,7);gx.fill();gx.lineWidth=3;gx.strokeStyle="rgba(0,0,0,.7)";gx.strokeText(nm,tx,py+3);gx.fillStyle="#fff";gx.fillText(nm,tx,py+3)}}
function gFrame(now){if(mvEl.hidden||gc.hidden){gRaf=0;return}const dt=Math.min((now-gLast)/1000,.1);gLast=now;if(!gDrag)gLon+=dt*.2;gDraw();gRaf=requestAnimationFrame(gFrame)}
