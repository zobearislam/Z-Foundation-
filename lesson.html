<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson | Z-Foundation</title>
<style>
:root{--bg:#070b16;--card:#101628;--line:#26314f;--ink:#e8ecf5;--dim:#9aa6c0;--acc:#7fd4c8;--ok:#58cc02;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 16px}
.x{color:var(--dim);font-size:30px;line-height:1;text-decoration:none}
.bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .3s}
.hearts{color:var(--bad);font-weight:700}
main{flex:1;overflow:auto;padding:12px 20px 20px}
h1{font-size:24px;line-height:1.3;margin:8px 0 20px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:15px 16px;margin:0 0 12px;cursor:pointer}
.opt.sel{border-color:var(--acc);background:rgba(127,212,200,.12)}
.opt.right{border-color:var(--ok);background:rgba(88,204,2,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.14)}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:15px 16px}
input:focus{outline:none;border-color:var(--acc)}
footer{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line)}
footer.ok{background:rgba(88,204,2,.14);border-color:var(--ok)}footer.bad{background:rgba(255,107,107,.14);border-color:var(--bad)}
#fb{margin-bottom:10px;min-height:0}#fb b{display:block;font-size:19px}#fb span{color:var(--dim);font-size:15px}
footer.ok #fb b{color:var(--ok)}footer.bad #fb b{color:var(--bad)}
#go{width:100%;font:inherit;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#06121a;background:var(--ok);border:0;border-bottom:4px solid #3f9600;border-radius:14px;padding:14px;cursor:pointer}
#go:disabled{background:var(--line);border-bottom-color:#1a2340;color:var(--dim);cursor:default}
footer.bad #go{background:var(--bad);border-bottom-color:#c94a4a}
.end{text-align:center;padding-top:40px}.end .big{font-size:64px}
.stats{display:flex;gap:12px;justify-content:center;margin:24px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 20px}.stat b{display:block;font-size:24px;color:var(--acc)}.stat span{font-size:13px;color:var(--dim)}
.end a{display:inline-block;color:#06121a;background:var(--ok);text-decoration:none;font-weight:700;padding:14px 28px;border-radius:14px;border-bottom:4px solid #3f9600;text-transform:uppercase}
</style></head><body>
<div id="app">
<div class="top"><a class="x" href="lessons.html" aria-label="Exit lesson">×</a><div class="bar"><i id="fill"></i></div><div class="hearts" id="hearts"></div></div>
<main id="stage"></main>
<footer id="foot"><div id="fb"></div><button id="go" disabled>Check</button></footer>
</div>
<script>
const $=s=>document.querySelector(s),KEY="zf_progress_v1";
const id=(new URLSearchParams(location.search).get("id")||"").replace(/[^a-z0-9_-]/gi,"");
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const day=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
function load(){try{return Object.assign({xp:0,streak:0,last:"",done:{}},JSON.parse(localStorage.getItem(KEY)))}catch(e){return{xp:0,streak:0,last:"",done:{}}}}
function save(id,xp,acc){const p=load(),t=new Date(),y=new Date(t-864e5);
  if(p.last!==day(t)){p.streak=p.last===day(y)?p.streak+1:1;p.last=day(t)}
  p.xp+=xp;const o=p.done[id]||{best:0,times:0};o.best=Math.max(o.best,acc);o.times++;p.done[id]=o;
  try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}
fetch("lessons/"+id+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(start).catch(()=>{$("#stage").innerHTML='<h1>Lesson not found</h1><p><a style="color:var(--acc)" href="lessons.html">Back to lessons</a></p>';$("#foot").hidden=true});
function start(L){
  document.title=L.title+" | Z-Foundation";
  const total=L.questions.length;let queue=L.questions.map(q=>({q,retry:false})),done=0,hearts=5,first=0,xp=0,cur=null,opts=null,picked=null,checked=false,ok=false;
  const go=$("#go"),foot=$("#foot"),fb=$("#fb"),stage=$("#stage");
  const upd=()=>{$("#fill").style.width=(done/total*100)+"%";$("#hearts").textContent="♥ "+hearts};
  function show(){
    upd();foot.className="";fb.innerHTML="";checked=false;picked=null;go.disabled=true;go.textContent="Check";
    if(hearts<=0)return fail();if(!queue.length)return finish();
    cur=queue[0];const q=cur.q;stage.innerHTML="";const h=document.createElement("h1");h.textContent=q.question;stage.appendChild(h);
    if(q.type==="type"){const i=document.createElement("input");i.type="text";i.autocomplete="off";i.autocapitalize="off";i.placeholder="Type your answer";i.oninput=()=>{picked=i.value;go.disabled=!norm(i.value)};i.onkeydown=e=>{if(e.key==="Enter"&&!go.disabled)go.click()};stage.appendChild(i);i.focus();opts=null}
    else{opts=q.type==="truefalse"?[{t:"True",ok:q.answer===true},{t:"False",ok:q.answer===false}]:shuffle(q.options.map((t,i)=>({t,ok:i===q.answer})));
      opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o.t;b.onclick=()=>{if(checked)return;picked=o;stage.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");go.disabled=false};o.el=b;stage.appendChild(b)})}
  }
  go.onclick=()=>{
    const q=cur.q;
    if(!checked){checked=true;let right;
      if(q.type==="type"){ok=q.answers.map(norm).includes(norm(picked));right=q.answers[0];stage.querySelector("input").disabled=true}
      else{ok=picked.ok;right=opts.find(o=>o.ok).t;opts.forEach(o=>{if(o.ok)o.el.classList.add("right");else if(o===picked)o.el.classList.add("wrong");o.el.disabled=true})}
      foot.className=ok?"ok":"bad";
      fb.innerHTML="<b></b><span></span>";fb.querySelector("b").textContent=ok?["Nice work!","Correct!","You got it!"][Math.floor(Math.random()*3)]:"Correct answer: "+right;fb.querySelector("span").textContent=q.explain||"";
      go.textContent="Continue";
    }else{
      queue.shift();
      if(ok){done++;xp+=10;if(!cur.retry)first++}else{hearts--;queue.push({q,retry:true})}
      show();
    }
  };
  function finish(){
    const acc=Math.round(first/total*100),bonus=first===total?5:0;xp+=bonus;save(L.id||id,xp,acc);
    foot.hidden=true;stage.innerHTML='<div class="end"><div class="big">🎉</div><h1>Lesson complete!</h1><div class="stats"><div class="stat"><b>+'+xp+'</b><span>XP</span></div><div class="stat"><b>'+acc+'%</b><span>First try</span></div></div><a href="lessons.html">Continue</a></div>';
  }
  function fail(){foot.hidden=true;stage.innerHTML='<div class="end"><div class="big">💔</div><h1>Out of hearts</h1><p style="color:var(--dim)">Review and try again.</p><div class="stats"></div><a href="lesson.html?id='+id+'">Try again</a></div>'}
  show();
}
</script></body></html>
