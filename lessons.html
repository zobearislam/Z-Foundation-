<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lessons | Z-Foundation</title><meta name="description" content="Short interactive lessons. Earn XP and keep your streak.">
<link rel="stylesheet" href="style.css">
<style>.stats{display:flex;gap:12px;margin:0 0 24px;flex-wrap:wrap}.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700}.lesson{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--ink)}.lesson:hover{border-color:var(--acc)}.ic{font-size:36px}.lesson h3{margin:0}.lesson p{margin:2px 0 0}.done{color:#58cc02;font-size:13px;font-weight:700}</style></head><body>
<header><nav><a class="brand" href="index.html">Z-Foundation</a><a href="index.html">Home</a><a href="topics.html">Topics</a><a href="lessons.html" aria-current="page">Lessons</a><a href="games.html">Games</a><a href="https://edhub.freeforums.net" target="_blank" rel="noopener">Forum</a><a href="solar-system.html">Solar System Map</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></header>
<main>
<h1>Lessons</h1><p class="lead">Short quizzes. Earn XP and keep your daily streak.</p>
<div class="stats"><span class="pill" id="streak">🔥 0 day streak</span><span class="pill" id="xp">⭐ 0 XP</span></div>
<div class="grid" id="list" style="grid-template-columns:1fr"><p>Loading lessons…</p></div>
</main>
<footer>© <span id="y">2026</span> Z-Foundation. Made for curious people.</footer>
<script>
document.getElementById("y").textContent=new Date().getFullYear();
let p={xp:0,streak:0,last:"",done:{}};try{p=Object.assign(p,JSON.parse(localStorage.getItem("zf_progress_v1")))}catch(e){}
const day=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(),t=new Date(),y=new Date(t-864e5);
const live=p.last===day(t)||p.last===day(y)?p.streak:0;
document.getElementById("streak").textContent="🔥 "+live+" day streak";document.getElementById("xp").textContent="⭐ "+p.xp+" XP";
const list=document.getElementById("list");
fetch("lessons/index.json").then(r=>r.json()).then(ix=>Promise.all(ix.lessons.map(id=>fetch("lessons/"+id+".json").then(r=>r.ok?r.json():null).then(l=>l&&{id,l}).catch(()=>null)))).then(rs=>{
  list.innerHTML="";rs.filter(Boolean).forEach(({id,l})=>{
    const a=document.createElement("a");a.className="card lesson";a.href="lesson.html?id="+encodeURIComponent(id);
    const d=p.done[id];
    a.innerHTML='<div class="ic"></div><div><h3></h3><p></p><span class="done"></span></div>';
    a.querySelector(".ic").textContent=l.icon||"📘";a.querySelector("h3").textContent=l.title;
    a.querySelector("p").textContent=(l.description||"")+" · "+l.questions.length+" questions";
    if(d)a.querySelector(".done").textContent="✓ Completed · best "+d.best+"%";
    list.appendChild(a)});
  if(!list.children.length)list.innerHTML="<p>No lessons yet.</p>";
}).catch(()=>{list.innerHTML="<p>Couldn't load lessons. They only load from the live website, not from a file opened directly on your phone.</p>"});
</script></body></html>
